<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#15213a" />
        <title>Offline</title>
        <style>
            :root {
                --background: #edf0f3;
                --card: #ffffff;
                --foreground: #15213a;
                --muted: #5b6678;
                --border: #d6dce4;
                --primary: #17604a;
                --primary-foreground: #ffffff;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --background: #0d1422;
                    --card: #141d2f;
                    --foreground: #e6ebf2;
                    --muted: #93a0b4;
                    --border: #26324a;
                    --primary: #3fa27f;
                    --primary-foreground: #04140e;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: var(--background);
                color: var(--foreground);
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    sans-serif;
            }

            main {
                width: 100%;
                max-width: 380px;
                padding: 32px 24px;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: var(--card);
                text-align: center;
            }

            img {
                width: 56px;
                height: 56px;
                border-radius: 14px;
            }

            h1 {
                margin: 16px 0 4px;
                font-size: 22px;
            }

            p {
                margin: 0 0 24px;
                color: var(--muted);
                line-height: 1.5;
            }

            button {
                min-height: 44px;
                padding: 0 20px;
                border: 0;
                border-radius: 8px;
                background: var(--primary);
                color: var(--primary-foreground);
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="" />
            <h1>You’re offline</h1>
            <p>Connect to Wi‑Fi or cellular, then try again.</p>
            <button type="button" onclick="location.reload()">Try again</button>
        </main>
    </body>
</html>
